name: Frontend y app Android

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-android.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-android.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Tipos y builds web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Chequeo de tipos
        run: npx tsc --noEmit

      - name: Build del panel
        run: npx vite build

      - name: Build de la app
        run: npx vite build --config vite.app.config.ts
        env:
          VITE_API_BASE_URL: ${{ vars.APP_API_BASE_URL || 'https://api.example.invalid' }}

  android:
    name: APK de prueba (debug)
    needs: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci

      # Debug build without Firebase (push disabled): checks that the native
      # project compiles. Release builds need google-services.json and a keystore.
      - name: Build web de la app y sync con Android
        run: npx vite build --config vite.app.config.ts && npx cap sync android
        env:
          VITE_API_BASE_URL: ${{ vars.APP_API_BASE_URL || 'https://api.example.invalid' }}
          VITE_PUSH_ENABLED: "false"

      - name: Compilar APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: guaynet-seguridad-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
