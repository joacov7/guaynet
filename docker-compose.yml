version: "3.9"

networks:
  guaynet_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - guaynet_net
    environment:
      POSTGRES_USER: guaynet
      POSTGRES_PASSWORD: guaynet
      POSTGRES_DB: guaynet
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guaynet"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - guaynet_net
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      guaynet_net:
        ipv4_address: 172.28.0.10
    env_file: .env
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://guaynet:guaynet@db:5432/guaynet
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - guaynet_net
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://guaynet:guaynet@db:5432/guaynet
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - guaynet_net
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://guaynet:guaynet@db:5432/guaynet
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    command: celery -A app.tasks.celery_app beat --loglevel=info

  bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - guaynet_net
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://guaynet:guaynet@db:5432/guaynet
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
    command: python bot.py

  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    restart: unless-stopped
    environment:
      - SUBDOMAINS=TU_SUBDOMINIO
      - TOKEN=TU_TOKEN
      - TZ=America/Argentina/Buenos_Aires
      - LOG_FILE=false

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - guaynet_net
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
