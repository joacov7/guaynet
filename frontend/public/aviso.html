<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Servicio suspendido</title>
  <style>
    :root { --ink: #1f2328; --quiet: #59636e; --line: #d8dee4; --accent: #009ee3; --bg: #f6f8fa; --card: #fff; --warn: #b35900; }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #e6edf3; --quiet: #9198a1; --line: #30363d; --bg: #0d1117; --card: #161b22; --warn: #f0883e; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
    main { max-width: 440px; margin: 0 auto; padding: 32px 16px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    .state { color: var(--warn); font-weight: 600; margin: 0 0 16px; }
    .amount { font-size: 32px; font-weight: 700; margin: 4px 0; }
    .quiet { color: var(--quiet); font-size: 14px; }
    button { width: 100%; margin-top: 20px; padding: 14px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    .error { color: var(--warn); font-size: 14px; margin-top: 12px; }
    .contact { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 14px; }
    .contact a { color: var(--accent); }
  </style>
</head>
<body>
<main>
  <div class="card" id="card">
    <h1 id="title">Tu servicio de internet está suspendido</h1>
    <p class="state" id="state">Cargando tu información…</p>
    <div id="debt" hidden>
      <div class="quiet">Saldo pendiente</div>
      <div class="amount" id="amount"></div>
      <div class="quiet" id="detail"></div>
      <button id="pay" type="button">Pagar con MercadoPago</button>
      <div class="error" id="error" hidden></div>
      <p class="quiet">Cuando se acredite el pago, el servicio se reactiva solo en unos minutos.</p>
    </div>
    <div class="contact" id="contact"></div>
  </div>
</main>
<script>
  const money = n => n.toLocaleString("es-AR", { style: "currency", currency: "ARS" });
  const day = iso => iso ? iso.split("-").reverse().join("/") : "";
  const $ = id => document.getElementById(id);
  const text = (el, value) => { el.textContent = value; };

  function contact(company) {
    const box = $("contact");
    box.textContent = "";
    const name = document.createElement("strong");
    name.textContent = company.name || "";
    box.appendChild(name);
    if (company.phone) {
      const digits = company.phone.replace(/[^0-9]/g, "");
      box.appendChild(document.createElement("br"));
      box.appendChild(document.createTextNode("Consultas: "));
      const a = document.createElement("a");
      a.href = "tel:" + digits;
      a.textContent = company.phone;
      box.appendChild(a);
    }
    if (company.address) {
      box.appendChild(document.createElement("br"));
      box.appendChild(document.createTextNode(company.address));
    }
  }

  fetch("/api/v1/portal/aviso", { cache: "no-store" })
    .then(r => r.json())
    .then(d => {
      contact(d.company || {});
      if (!d.found) {
        text($("state"), "No pudimos identificar tu conexión. Comunicate con nosotros para regularizar.");
        return;
      }
      text($("title"), d.suspended ? `Hola ${d.first_name}, tu servicio está suspendido` : `Hola ${d.first_name}`);
      text($("state"), d.suspended ? "El servicio se suspendió por falta de pago." : "Tenés pagos pendientes.");
      if (d.debt_total > 0) {
        $("debt").hidden = false;
        text($("amount"), money(d.debt_total));
        text($("detail"), d.overdue_count
          ? `${d.overdue_count} factura${d.overdue_count > 1 ? "s" : ""} vencida${d.overdue_count > 1 ? "s" : ""} desde el ${day(d.oldest_due)}`
          : "");
        if (!d.can_pay_online) $("pay").hidden = true;
      }
    })
    .catch(() => text($("state"), "No pudimos cargar tu información. Comunicate con nosotros para regularizar."));

  $("pay").addEventListener("click", () => {
    const btn = $("pay");
    btn.disabled = true;
    text(btn, "Abriendo MercadoPago…");
    $("error").hidden = true;
    fetch("/api/v1/portal/aviso/pagar", { method: "POST" })
      .then(r => r.json().then(d => ({ ok: r.ok, d })))
      .then(({ ok, d }) => {
        if (!ok || !d.init_point) throw new Error(d.detail || "No se pudo generar el pago");
        window.location.href = d.init_point;
      })
      .catch(e => {
        $("error").hidden = false;
        text($("error"), e.message + ". Comunicate con nosotros para pagar.");
        btn.disabled = false;
        text(btn, "Pagar con MercadoPago");
      });
  });
</script>
</body>
</html>
