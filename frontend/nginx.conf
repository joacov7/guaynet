server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API proxy to backend
    location /api/ {
        resolver 127.0.0.11 valid=5s;
        set $upstream http://backend:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Discovery scan can take minutes for large subnets
    location /api/v1/ubiquiti/discover {
        resolver 127.0.0.11 valid=5s;
        set $upstream http://backend:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # Plans sync-all can take several minutes with hundreds of clients across routers
    location ~ ^/api/v1/plans/[0-9]+/sync-all$ {
        resolver 127.0.0.11 valid=5s;
        set $upstream http://backend:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_connect_timeout 15s;
    }

    # Mikrotik sync-clients can take 2-3 minutes on high-latency links (200+ queues)
    location ~ ^/api/v1/routers/[0-9]+/sync-clients$ {
        resolver 127.0.0.11 valid=5s;
        set $upstream http://backend:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_connect_timeout 15s;
    }

    # Mikrotik setup-qos applies PCQ + mangle rules, can take 90s on slow links
    location ~ ^/api/v1/routers/[0-9]+/setup-qos$ {
        resolver 127.0.0.11 valid=5s;
        set $upstream http://backend:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_connect_timeout 15s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
