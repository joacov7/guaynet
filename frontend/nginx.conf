server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Backend has a fixed IP on guaynet_net (docker-compose.yml): avoids the
    # Docker DNS resolution failures seen in production.
    location /api/ {
        proxy_pass http://172.28.0.10:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Discovery scan can take minutes for large subnets
    location /api/v1/ubiquiti/discover {
        proxy_pass http://172.28.0.10:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # Plans sync-all can take several minutes with hundreds of clients across routers
    location ~ ^/api/v1/plans/[0-9]+/sync-all$ {
        proxy_pass http://172.28.0.10:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_connect_timeout 15s;
    }

    # Mikrotik sync-clients can take 2-3 minutes on high-latency links (200+ queues)
    location ~ ^/api/v1/routers/[0-9]+/sync-clients$ {
        proxy_pass http://172.28.0.10:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_connect_timeout 15s;
    }

    # Mikrotik per-client sync waits up to 30s for a RouterOS connection
    location ~ ^/api/v1/clients/[0-9]+/sync-mikrotik$ {
        proxy_pass http://172.28.0.10:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
    }

    # Mikrotik setup-qos applies PCQ + mangle rules, can take 90s on slow links
    location ~ ^/api/v1/routers/[0-9]+/setup-qos$ {
        proxy_pass http://172.28.0.10:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_connect_timeout 15s;
    }

    location /uploads/ {
        proxy_pass http://172.28.0.10:8000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
